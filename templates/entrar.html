{% extends "base.html" %}
{% block titulo %}Entrar · Conciliador BDV{% endblock %}
{% block contenido %}
<h1 style="margin-bottom:20px">Conciliador BDV</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" class="fila">
 <input type="hidden" name="csrf" value="{{ csrf }}">
 <input name="usuario" placeholder="Usuario" autocomplete="username" required autofocus>
 <input name="clave" type="password" placeholder="Clave" autocomplete="current-password" required>
 <button>Entrar</button>
</form>
<p class="gris" style="font-size:13px;margin-top:16px">¿Olvidaste la clave? Pídele al administrador que te la cambie.</p>
{% endblock %}
